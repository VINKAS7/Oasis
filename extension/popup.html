<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oasis Recorder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <span>Oasis Recorder</span>
    </header>
    <main id="view"><p class="muted">Loading…</p></main>
    <footer>
      <button id="settings-toggle" class="link">Settings</button>
      <span id="who" class="muted"></span>
    </footer>
    <section id="settings" hidden>
      <label>
        Oasis address
        <input id="app-url" type="url" placeholder="http://localhost:5173" />
      </label>
      <div class="row">
        <button id="save-settings" class="secondary">Save</button>
        <button id="logout" class="link danger">Log out</button>
      </div>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
