[project]
name = "agentready-backend"
version = "0.1.0"
description = "AgentReady platform API: workspaces, website crawler and the admin-controlled AI gateway."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "playwright>=1.49",
    "cryptography>=44",
    "anthropic>=0.60",
    "python-dotenv>=1.0",
    "mcp>=1.20",
    "pillow>=13.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
