<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Oasis items</title>
<!--
  Oasis item cards as an MCP App (extension io.modelcontextprotocol/ui, protocol 2026-01-26).
  The assistant (Claude, ChatGPT...) shows this page in a sandboxed frame and talks to it with
  JSON-RPC over postMessage: ui/initialize, then ui/notifications/tool-result with the tool's
  result. Ordering goes back to the Oasis server with tools/call, only after the customer clicks
  Send order; prices always come from the server.

  Three kinds of result: a business's items (show_items, get_menu...), businesses (find_nearby,
  search_businesses: nearest first, with a Google map of the route), and a request for the user's
  location (find_nearby without one). The location is asked from the browser only when the user
  presses "Use my location", sent to Oasis for that one search, and never stored.
-->
<style>
  /* The frame stays transparent so the conversation shows through. Its color-scheme must match
     the assistant's theme: when it differs, browsers paint an opaque white (or black) canvas. */
  :root { color-scheme: light; }
  :root.dark { color-scheme: dark; }
  :root {
    --bg: transparent; --card: #ffffff; --ink: #0b0e13; --ink-2: #44474d; --muted: #75777c; --line: #e6e5e0;
    --soft: #f4f3ee; --accent: #0d8a78; --accent-ink: #ffffff; --strong: #1c1f24; --strong-ink: #ffffff;
    --ok-bg: #e8f5ec; --ok-line: #bfe3c9; --bad-bg: #fbecea; --bad-line: #f2c6c0; --bad-ink: #a3362a;
  }
  :root.dark {
    --card: #15191f; --ink: #f4f3ee; --ink-2: #d4d3ce; --muted: #9a9b9f; --line: #2a2f36;
    --soft: #1c2128; --accent: #2de2c8; --accent-ink: #0b0e13; --strong: #f4f3ee; --strong-ink: #0b0e13;
    --ok-bg: rgba(52, 168, 83, .14); --ok-line: rgba(52, 168, 83, .35); --bad-bg: rgba(220, 80, 60, .14); --bad-line: rgba(220, 80, 60, .35); --bad-ink: #f19a8c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--ink); font: 14px/1.45 var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  #app { padding: 2px 2px 6px; }
  .head { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .head b { color: var(--ink); font-weight: 600; }
  .section { margin: 12px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .grid.text { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s; }
  .card.picked { border-color: var(--strong); }
  .pic { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; display: block; background: var(--soft); }
  .nopic { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: var(--soft); color: var(--muted); font-size: 12px; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .name { font-weight: 600; line-height: 1.3; }
  .price { flex-shrink: 0; font-weight: 600; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .desc { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 3; }
  .text .desc { -webkit-line-clamp: 5; }
  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  button { font: inherit; cursor: pointer; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; }
  .link:hover { text-decoration: underline; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
  .chip:hover { background: var(--soft); }
  .stepper { display: inline-flex; align-items: center; background: var(--strong); color: var(--strong-ink); border-radius: 999px; }
  .stepper button { background: none; border: 0; color: inherit; width: 28px; height: 26px; border-radius: 999px; font-size: 15px; line-height: 1; }
  .stepper span { min-width: 18px; text-align: center; font-size: 12px; font-weight: 700; }
  .more { margin-top: 10px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .bar { position: sticky; bottom: 4px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
         background: var(--strong); color: var(--strong-ink); border-radius: 12px; padding: 9px 10px 9px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .bar button { background: var(--strong-ink); color: var(--strong); border: 0; border-radius: 999px; padding: 5px 12px; font-weight: 600; }
  .panel { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel h4 { margin: 0 0 6px; font-size: 14px; }
  .lines { list-style: none; margin: 0; padding: 0; }
  .lines li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .total { display: flex; justify-content: space-between; padding-top: 7px; font-weight: 700; font-size: 13px; }
  .fields { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-top: 12px; }
  input { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  input:focus { outline: none; border-color: var(--accent); }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; }
  .primary[disabled] { opacity: .6; cursor: default; }
  .secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; }
  .error { color: var(--bad-ink); font-size: 13px; margin-top: 8px; }
  .status.accepted { background: var(--ok-bg); border-color: var(--ok-line); }
  .status.declined { background: var(--bad-bg); border-color: var(--bad-line); }
  .status .title { font-weight: 600; }
  .status p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .opts select { font: inherit; font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
  .dots { display: flex; justify-content: center; gap: 5px; margin-top: -14px; position: relative; padding-bottom: 6px; }
  .dots button { width: 7px; height: 7px; border-radius: 50%; border: 0; padding: 0; background: rgba(255,255,255,.55); box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .dots button.on { background: #fff; }
  .tags { color: var(--muted); font-size: 11.5px; }
  .stock { font-size: 11.5px; color: var(--muted); }
  .stock.low { color: #b45309; }
  .stock.out { color: var(--bad-ink); }
  .brand { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; margin-top: 10px; }
  .brand i { width: 8px; height: 8px; border-radius: 50%; background: #1fc9ae; display: inline-block; }
  /* places: businesses found nearby or by search */
  .places { display: grid; gap: 10px; }
  .place { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s; }
  .place.picked { border-color: var(--accent); }
  .place .desc { -webkit-line-clamp: 2; }
  .dist { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .mis { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .mi { background: var(--soft); border-radius: 999px; padding: 2px 9px; font-size: 11.5px; color: var(--ink-2); }
  .map { margin-top: 8px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .map iframe { display: block; width: 100%; height: 280px; border: 0; background: var(--soft); }
  .maprow { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: center; padding: 7px 10px; background: var(--soft); }
  .back { margin-right: 8px; }
  .sortbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; padding: 8px 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .sortbar .label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .sortbar input { flex: 1; min-width: 160px; }
  .sortbar .primary, .sortbar .secondary { padding: 5px 12px; }
  .sortbar .error { flex-basis: 100%; }
  .inline { display: flex; gap: 8px; margin-top: 10px; }
  .inline input { flex: 1; }
  .link[disabled] { opacity: .6; cursor: default; text-decoration: none; }
  /* v8: a livelier catalog: hover lift, filters, photo viewer, full screen, loading shimmer */
  .card { box-shadow: 0 1px 2px rgba(15,15,15,.04); transition: border-color .15s, transform .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(15,15,15,.05), 0 10px 26px rgba(15,15,15,.10); }
  .place { transition: border-color .15s, transform .15s, box-shadow .15s; }

  .pic { cursor: zoom-in; transition: transform .25s; }
  .card:hover .pic { transform: scale(1.03); }
  .picwrap { overflow: hidden; position: relative; }
  .headrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .headrow .head { margin: 0; }

  .iconbtn:hover { background: var(--soft); }
  .iconbtn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 10px; }
  .search { position: relative; flex: 1; min-width: 170px; }
  .search input { padding-left: 30px; border-radius: 999px; }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .tools select { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: var(--card); }
  .toggle.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .sects { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin: 0 0 10px; scrollbar-width: none; }
  .sects::-webkit-scrollbar { display: none; }
  .sect { white-space: nowrap; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 600; }
  .sect.on { background: var(--strong); color: var(--strong-ink); border-color: var(--strong); }
  .sect .n { opacity: .6; margin-left: 4px; font-weight: 500; }
  .viewer { position: relative; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(15,15,15,.15); animation: vpop .18s ease-out; }
  @keyframes vpop { from { transform: scale(.985); } to { transform: none; } }
  .viewer img { display: block; width: 100%; max-height: 420px; object-fit: contain; background: var(--soft); }
  .viewer .vbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; }
  .viewer .nav { position: absolute; top: 40%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0;
                 background: rgba(0,0,0,.45); color: #fff; font-size: 18px; line-height: 1; }
  .viewer .nav.prev { left: 10px; } .viewer .nav.next { right: 10px; }
  .viewer .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 16px; }
  .bar { animation: vpop .18s ease-out; }
  .bar.bump { animation: bump .35s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .skel { border-radius: 12px; background: linear-gradient(90deg, var(--soft) 0, var(--line) 50%, var(--soft) 100%); background-size: 600px 100%;
          animation: shimmer 1.3s infinite linear; }
  @keyframes shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  const pickLang = (l) => { const c = String(l || "").slice(0, 2).toLowerCase(); return STRINGS[c] ? c : "en"; };

  }
  const items = () => ((data && data.result && data.result.items) || []);
  const byId = (id) => items().find((i) => i.id === id);

  // The variant chosen on a card: the owner's choice, else the first combination in stock.

    const combos = ax.reduce((acc, a) => acc.flatMap((k) => i.options[a].map((v) => (k ? `${k}/${v}` : v))), [""]);
    const inStock = (c) => { const n = stockOf(i, c); return n === null || n > 0; };
    const fits = (c) => c.split("/").every((v, n) => !pick[ax[n]] || pick[ax[n]] === v);
    return combos.find((c) => fits(c) && inStock(c)) || combos.find(fits) || combos.find(inStock) || combos[0];

  // Ordering needs the business's yes and a list with prices (not projects or skills).

    for (const [k, q] of Object.entries(cart)) {

      <div class="total"><span>${tr("Total")}</span><span>${total === null ? tr("confirmed by the business") : esc(money(total, currency))}</span></div>
      <div class="fields">
        <input name="customer_name" required maxlength="80" placeholder="${tr("Your name")}" value="${esc(form.customer_name)}">
        <input name="customer_contact" required maxlength="120" placeholder="${tr("Phone or email")}" value="${esc(form.customer_contact)}">
        <input name="pickup_time" maxlength="40" placeholder="${tr("When? e.g. today 19:00")}" value="${esc(form.pickup_time)}">
        <input name="note" maxlength="300" placeholder="${tr("Note (optional)")}" value="${esc(form.note)}">
      </div>
      ${error ? `<div class="error">${esc(error)}</div>` : ""}
      <p class="note">${tr("{b} confirms or declines your order; you'll see the answer here. Nothing is paid now.", { b: esc(data.business) })}</p>
      <div class="buttons"><button class="primary" type="submit" ${busy ? "disabled" : ""}>${busy ? tr("Sending…") : tr("Send order")}</button>
      <button class="secondary" type="button" data-back ${busy ? "disabled" : ""}>${tr("Back")}</button></div></form>`;
  }

  function statusPanel() {
    const o = order;
    const title = tr(o.status === "accepted" ? "{b} accepted your order" : o.status === "declined" ? "{b} declined your order" : "Sent to {b}, waiting for their answer…", { b: data.business });
    const what = (o.lines || []).map((l) => `${l.quantity}× ${l.name}`).join(", ") + (o.total !== null && o.total !== undefined ? ` · ${money(o.total, o.currency)}` : "");
    return `<div class="panel status ${esc(o.status)}"><div class="title">${esc(title)}</div><p>${esc(what)}</p>
      ${o.owner_note ? `<p>“${esc(o.owner_note)}”</p>` : ""}
      ${o.status === "pending" ? `<div class="buttons"><button class="secondary" data-check ${busy ? "disabled" : ""}>${tr("Check now")}</button></div>` : ""}
      ${error ? `<div class="error">${esc(error)}</div>` : ""}</div>`;
  }

  // ---- places: businesses nearest first, with a map ----
  const placeList = () => (places ? [...(places.businesses || []), ...(places.online || [])] : []);
  const placeById = (id) => placeList().find((b) => b.business_id === id);
  const km = (d) => (d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(d < 10 ? 1 : 0)} km`);
  const coords = (p) => `${Number(p.lat).toFixed(5)},${Number(p.lng).toFixed(5)}`;
  function mapSrc(b) {
    // Google Maps' keyless embed: the route from the user when we know where they are, else the place.
    return me ? `https://maps.google.com/maps?saddr=${coords(me)}&daddr=${coords(b)}&output=embed`
              : `https://maps.google.com/maps?q=${coords(b)}&z=15&output=embed`;
  }
  const directions = (b) => `https://www.google.com/maps/dir/?api=1${me ? `&origin=${coords(me)}` : ""}&destination=${coords(b)}`;

  function placeCard(b) {
    const id = esc(b.business_id);
    const located = b.lat !== null && b.lat !== undefined && b.lng !== null && b.lng !== undefined;
    const open = selected === b.business_id && located;
    const dist = typeof b.distance_km === "number" ? `<span class="dist">${km(b.distance_km)}</span>` : b.online_only ? `<span class="dist">${tr("Online")}</span>` : "";
    const when = b.open_at_requested_time === true ? ` · ${tr("open then")}` : "";
    const hits = (b.matching_items || []).map((i) => `<span class="mi">${esc(i.name)}${i.price ? ` · ${esc(i.price)}` : ""}</span>`).join("");
    let map = "";
    if (open) {
      map = `<div class="map"><iframe src="${esc(mapSrc(b))}" title="${tr("Map: {b}", { b: esc(b.name) })}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        <div class="maprow"><span class="tags">${me ? `${esc(me.label)} → ${esc(b.name)}` : esc(b.address || b.name)}</span>
        <span>${me ? "" : `<button class="link" data-route="${id}" ${locating ? "disabled" : ""}>${locating ? tr("Locating…") : tr("Route from my location")}</button> `}
        <button class="link" data-dir="${id}">${tr("Open in Google Maps ↗")}</button></span></div></div>
        ${locError ? `<div class="error">${esc(locError)}</div>` : ""}`;
    }
    return `<div class="place${open ? " picked" : ""}">
      <div class="row"><span class="name">${esc(b.name)}</span>${dist}</div>
      <div class="tags">${esc(b.kind)}${b.address ? ` · ${esc(b.address)}` : ""}${when}</div>
      ${b.description ? `<div class="desc">${esc(b.description)}</div>` : ""}
      ${hits ? `<div class="mis">${hits}</div>` : ""}
      <div class="actions"><button class="chip" data-items="${id}" ${opening ? "disabled" : ""}>${opening === b.business_id ? tr("Opening…") : tr("Show items")}</button>
        ${located ? `<button class="chip" data-map="${id}">${open ? tr("Hide map") : tr("Map")}</button><button class="link" data-dir="${id}">${tr("Directions ↗")}</button>` : ""}
        ${b.online_only && b.website ? `<button class="link" data-open="${esc(b.website)}">${tr("Website ↗")}</button>` : ""}</div>
      ${map}</div>`;
  }

  function locatePanel() {
    const what = places.query || places.type || tr("places");
    return `<form class="panel" id="where"><h4>${tr("Find the nearest {w}", { w: esc(what) })}</h4>
      <p class="note" style="margin-top:0">${tr("Share your location so Oasis can find the closest places. It's used for this search only and never stored.")}</p>
      <div class="buttons"><button class="primary" type="button" data-locate ${locating ? "disabled" : ""}>${locating ? tr("Locating…") : tr("Use my location")}</button></div>
      <div class="inline"><input name="where" maxlength="120" placeholder="${tr("Or type a street, area or city")}" aria-label="${tr("Your street, area or city")}" value="${esc(where)}">
        <button class="secondary" type="submit" ${locating ? "disabled" : ""}>${tr("Search")}</button></div>
      ${locError ? `<div class="error">${esc(locError)}</div>` : ""}</form>`;
  }

  // Above results found without a location: share it or type a place to sort them nearest first.
  function sortBar() {
    return `<form class="sortbar" id="where"><span class="label">${tr("Sort by distance")}</span>
      <button class="primary" type="button" data-locate ${locating ? "disabled" : ""}>${locating ? tr("Locating…") : tr("Use my location")}</button>
      <input name="where" maxlength="120" placeholder="${tr("or type a street, area or city")}" aria-label="${tr("Your street, area or city")}" value="${esc(where)}">
      <button class="secondary" type="submit" ${locating ? "disabled" : ""}>${tr("Search")}</button>
      ${locError ? `<div class="error">${esc(locError)}</div>` : ""}</form>`;
  }

  function renderPlaces() {
    const p = places;
    const list = p.businesses || [];
    const online = p.online || [];
    // Only when there's nothing to list yet (a place that couldn't be found): ask where they are.
    // A search everywhere that found nothing says so below; a location wouldn't change it.
    if (p.need_location && !Array.isArray(p.businesses)) { app.innerHTML = locatePanel() + `<div class="brand"><i></i>Oasis</div>`; return; }
    const what = p.query || p.type || "";
    let html = p.you
      ? `<div class="head"><b>${what ? tr("Nearest {w}", { w: esc(what) }) : tr("Nearest")}</b> · ${tr("near {p}", { p: esc(p.you.label) })}${p.you.approximate ? tr(" (approximate)") : ""}</div>`
      : `<div class="head"><b>${tr(list.length === 1 ? "{n} result" : "{n} results", { n: list.length })}</b>${what ? tr(" for “{w}”", { w: esc(what) }) : ""}${p.need_location ? tr(" · not sorted by distance") : ""}</div>`;
    if (p.need_location && list.length) html += sortBar();
    if (error) html += `<div class="error">${esc(error)}</div>`;
    if (p.widened && list.length) html += `<p class="note" style="margin-top:0">${tr("Nothing within {km} km, so these are the closest.", { km: esc(p.radius_km) })}</p>`;
    if (!list.length) html += `<p class="empty">${tr(p.you ? "No place near you offers that yet." : online.length ? "No local place offers that yet." : "No business offers that yet.")}</p>`;
    if (list.length) html += `<div class="places">${list.map(placeCard).join("")}</div>`;
    if ((p.online || []).length) html += `<div class="section">${tr("Also online")}</div><div class="places">${p.online.map(placeCard).join("")}</div>`;
    if (p.you) html += `<p class="note">${tr("Your location is used for this search only and never stored.")}</p>`;
    html += `<div class="brand"><i></i>Oasis</div>`;
    app.innerHTML = html;
  }

  function geolocate() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) { reject(new Error(tr("This app can't read your location here. Type a street, area or city instead."))); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, label: tr("Your location"), approximate: false }),
        (err) => reject(new Error(tr(err && err.code === 1 ? "Location access is blocked here. Type a street, area or city instead."
                                                            : "Couldn't get your location. Type a street, area or city instead."))),
        { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
    });
  }

  // Search again near the user: their position from the browser, or a place they typed.
  async function searchNear(args) {
    const q = places || {};
    locating = true; locError = ""; render();
    try {
      const r = await callTool("find_nearby", { query: q.query || "", ...(q.type ? { type: q.type } : {}), ...(q.radius_km ? { radius_km: q.radius_km } : {}), ...args });
      locating = false;
      show(r);
      // The assistant didn't see this search: say what the user now sees (no coordinates).
      const names = (r.businesses || []).slice(0, 5).map((b) => `${b.name}${typeof b.distance_km === "number" ? ` (${b.distance_km} km)` : ""}`).join(", ");
      if (!r.need_location) request("ui/update-model-context", { content: [{ type: "text", text: `The user shared their location in the Oasis card. ${r.message || ""} Shown: ${names || "nothing nearby"}.` }] }).catch(() => undefined);
    } catch (err) { locating = false; locError = err.message; render(); }
  }

  async function useMyLocation() {
    locating = true; locError = ""; render();
    try {
      const pos = await geolocate();
      me = pos;
      await searchNear({ latitude: Number(pos.lat.toFixed(5)), longitude: Number(pos.lng.toFixed(5)) });
    } catch (err) { locating = false; locError = err.message; render(); }
  }

  async function routeFromMe() {
    locating = true; locError = ""; render();
    try { me = await geolocate(); } catch (err) { locError = err.message; }
    locating = false; render();
  }

  async function openItems(id, search) {
    opening = id; error = ""; render();
    try {
      const r = await callTool("show_items", { business_id: id, ...(search ? { search } : {}) });
      opening = "";
      backTo = places;  // before show(), which draws the Back button from it
      show(r);
    } catch (err) { opening = ""; error = err.message; render(); }
  }

  function render() {
    if (places) { renderPlaces(); return; }
    if (!data) return;
    const all = items();
    const title = (data.result && data.result.title) || data.tool || tr("Items");
    const back = backTo ? `<button class="link back" data-back-places>${tr("← Back")}</button>` : "";
    if (!all.length) { app.innerHTML = `<div class="head">${back}<b>${esc(title)}</b> · ${esc(data.business)}</div><p class="empty">${tr("No items right now.")}</p>`; return; }
    const list = filtered();
    const filtering = !!(query.trim() || sect || stockOnly);
    const shown = showAll || isFullscreen() ? list : list.slice(0, SHOWN);
    const pictures = all.some((i) => i.image_url);
    const allSections = [...new Set(all.map((i) => i.section || ""))].filter(Boolean);
    const sections = sect || sort ? [""] : [...new Set(shown.map((i) => i.section || ""))];
    const countText = filtering ? tr("{n} of {m} items", { n: list.length, m: all.length }) : tr(all.length === 1 ? "{n} item" : "{n} items", { n: all.length });
    const full = canFullscreen() && all.length > 4
      ? `<button class="iconbtn" data-full>${isFullscreen() ? SVG.shrink + tr("Exit full screen") : SVG.expand + tr("Full screen")}</button>` : "";
    let html = `<div class="headrow"><div class="head">${back}<b>${esc(title)}</b> · ${esc(data.business)} · ${esc(countText)}</div>${full}</div>`;
    if (data.search && data.message) html += `<p class="note" style="margin:-4px 0 10px">${esc(data.message)} <button class="link" data-everything>${tr("Show everything")}</button></p>`;
    if (all.length >= 6) {
      const priced = all.filter((i) => i.amount !== null && i.amount !== undefined).length > 1;
      html += `<div class="tools"><label class="search">${SVG.search}<input id="q" type="search" placeholder="${tr("Search these items")}" value="${esc(query)}" aria-label="${tr("Search these items")}"></label>
        ${priced ? `<select id="sort" aria-label="${tr("Sort")}"><option value="">${tr("Recommended")}</option><option value="asc"${sort === "asc" ? " selected" : ""}>${tr("Price: low to high")}</option><option value="desc"${sort === "desc" ? " selected" : ""}>${tr("Price: high to low")}</option></select>` : ""}
        ${all.some(tracked) ? `<button class="toggle${stockOnly ? " on" : ""}" data-stock>${tr("In stock")}</button>` : ""}</div>`;
    }
    if (allSections.length > 1) {
      html += `<div class="sects"><button class="sect${sect ? "" : " on"}" data-sect="">${tr("All")}</button>${allSections.map((x) =>
        `<button class="sect${sect === x ? " on" : ""}" data-sect="${esc(x)}">${esc(x)}<span class="n">${all.filter((i) => i.section === x).length}</span></button>`).join("")}</div>`;
    }
    if (viewing) {
      const vi = byId(viewing.id), ph = vi ? photosOf(vi) : [];
      if (vi && ph.length) {
        const n = Math.min(viewing.n, ph.length - 1), src = photoData[`${vi.id}:${n}`] || ph[n];
        html += `<div class="viewer"><img src="${esc(src)}" alt="${esc(vi.name)}" referrerpolicy="no-referrer">
          <button class="close" data-unview aria-label="${tr("Close")}">×</button>
          ${ph.length > 1 ? `<button class="nav prev" data-view-step="-1" aria-label="${tr("Previous photo")}">‹</button><button class="nav next" data-view-step="1" aria-label="${tr("Next photo")}">›</button>` : ""}
          <div class="vbar"><span class="name">${esc(vi.name)}</span><span class="price">${esc(money(vi.amount, vi.currency) || vi.price || "")}</span></div></div>`;
      }
    }
    if (!list.length) html += `<p class="empty">${tr("Nothing matches these filters.")} <button class="link" data-clear>${tr("Clear filters")}</button></p>`;
    for (const s of sections) {
      if (sections.length > 1 && s) html += `<div class="section">${esc(s)}</div>`;
      const inSection = sections.length > 1 ? shown.filter((i) => (i.section || "") === s) : shown;
      if (inSection.length) html += `<div class="grid${pictures ? "" : " text"}">${inSection.map((i) => card(i, pictures)).join("")}</div>`;
    }
    if (list.length > SHOWN && !isFullscreen()) html += `<div class="more"><button class="link" data-all>${showAll ? tr("Show fewer") : tr("Show all {n}", { n: list.length })}</button></div>`;
    if (!data.can_order && all.some((i) => i.amount !== null && i.amount !== undefined)) html += `<p class="note">${tr("{b} doesn't take orders through Oasis. Contact them directly to order.", { b: esc(data.business) })}</p>`;
    const { count, total, currency } = cartTotal();
    if (canOrder() && count && step === "pick") {
      html += `<div class="bar"><span>${tr("Your order")} · ${tr(count === 1 ? "{n} item" : "{n} items", { n: count })}${total !== null ? ` · ${esc(money(total, currency))}` : ""}</span><button data-review>${tr("Review order")}</button></div>`;
    }
    if (canOrder() && step === "review") html += reviewPanel();
    if (order) html += statusPanel();
    html += `<div class="brand"><i></i>Oasis</div>`;
    const focus = document.activeElement && document.activeElement.id === "q";
    const caret = focus ? document.activeElement.selectionStart : null;
    app.innerHTML = html;
    if (focus) { const box = document.getElementById("q"); box.focus(); if (caret !== null) box.setSelectionRange(caret, caret); }
    for (const img of app.querySelectorAll("img[data-fallback]")) {
      img.addEventListener("error", () => photoFallback(img), { once: true });
    }
  }

  async function photoFallback(img) {
    const id = img.dataset.item, n = Number(img.dataset.index || 0);
    const noPic = () => { const d = document.createElement("div"); d.className = "nopic"; d.textContent = tr("No picture"); img.replaceWith(d); };
    if (!id || img.src.startsWith("data:")) return noPic();
    try {
      const r = data.business_id ? await callTool("product_photo", { business_id: data.business_id, product_id: id, index: n })
                                 : await callTool("product_photo", { product_id: id, index: n });
      if (!r.data_url) return noPic();
      photoData[`${id}:${n}`] = r.data_url;
      img.src = r.data_url;
    } catch { noPic(); }
  }

  // ---- events ----
  app.addEventListener("click", (e) => {
    const zoom = e.target.closest && e.target.closest("img[data-zoom]");
    if (zoom) { viewing = { id: zoom.dataset.zoom, n: Number(zoom.dataset.index || 0) }; render(); app.scrollIntoView({ block: "start", behavior: "smooth" }); return; }
    const t = e.target.closest("button");
    if (!t || t.disabled) return;
    // catalog filters, photo viewer, full screen
    if (t.dataset.sect !== undefined) { sect = t.dataset.sect; showAll = false; render(); return; }
    if ("stock" in t.dataset) { stockOnly = !stockOnly; render(); return; }
    if ("clear" in t.dataset) { query = ""; sect = ""; stockOnly = false; render(); return; }
    if ("full" in t.dataset) { toggleFullscreen(); return; }
    if ("unview" in t.dataset) { viewing = null; render(); return; }
    if (t.dataset.viewStep) {
      const vi = byId(viewing.id), n = photosOf(vi).length;
      viewing = { ...viewing, n: (viewing.n + Number(t.dataset.viewStep) + n) % n }; render(); return;
    }
    // places
    if ("locate" in t.dataset) { useMyLocation(); return; }
    if (t.dataset.items) { openItems(t.dataset.items, places && places.query); return; }
    if (t.dataset.map) { selected = selected === t.dataset.map ? "" : t.dataset.map; locError = ""; render(); return; }
    if (t.dataset.dir) { const b = placeById(t.dataset.dir); if (b) openLink(directions(b)); return; }
    if (t.dataset.route) { routeFromMe(); return; }
    if ("backPlaces" in t.dataset) { places = backTo; backTo = null; data = null; render(); return; }
    if ("everything" in t.dataset) {
      callTool("show_items", { business_id: data.business_id, tool: data.tool }).then(show).catch((err) => { error = err.message; render(); });
      return;
    }
    // items
    if (t.dataset.photo) { photoAt = { ...photoAt, [t.dataset.photo]: Number(t.dataset.n) }; render(); return; }
    if (t.dataset.qty) {
      const max = Math.min(20, Number(t.dataset.max || 20));
      const q = Math.max(0, Math.min(max, (cart[t.dataset.qty] || 0) + Number(t.dataset.d)));
      cart = { ...cart, [t.dataset.qty]: q };
      if (!cartTotal().count) step = "pick";
      render();
      const bar = app.querySelector(".bar");
      if (bar && Number(t.dataset.d) > 0) { bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump"); }
    } else if (t.dataset.open) openLink(t.dataset.open);
    else if (t.dataset.ask) ask(tr("Tell me more about “{item}” from {b}.", { item: t.dataset.ask, b: data.business }));
    else if ("all" in t.dataset) { showAll = !showAll; render(); }
    else if ("review" in t.dataset) { step = "review"; error = ""; render(); }
    else if ("back" in t.dataset) { step = "pick"; error = ""; render(); }
    else if ("check" in t.dataset) checkStatus(true);
  });
  app.addEventListener("input", (e) => {
    if (e.target.id === "q") { query = e.target.value; showAll = false; render(); return; }
    if (e.target.name === "where") where = e.target.value;
    else if (e.target.name in form) form[e.target.name] = e.target.value;
  });
  app.addEventListener("change", (e) => {
    if (e.target.id === "sort") { sort = e.target.value; render(); return; }
    const sel = e.target.closest && e.target.closest("select[data-opt]");
    if (!sel) return;
    const id = sel.dataset.opt, i = byId(id);
    const current = Object.fromEntries(axes(i).map((a, n) => [a, variantOf(i).split("/")[n]]));
    chosen = { ...chosen, [id]: { ...current, [sel.dataset.axis]: sel.value } };
    render();
  });
  app.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id !== "where") { sendOrder(); return; }
    if (!where.trim()) { locError = tr("Type a street, area or city."); render(); return; }
    searchNear({ location: where.trim() });
  });

  // Through the business's own MCP server the order tools are called directly; through the shared
  // Oasis directory (show_items) they go through call_business_tool.
  function orderTool(name, inputs, confirmed) {
    if (data.business_id) return callTool("call_business_tool", { business_id: data.business_id, tool: name, inputs, user_confirmed: confirmed });
    return callTool(name, confirmed ? { ...inputs, user_confirmed: true } : inputs);
  }

  async function sendOrder() {
    if (busy) return;
    busy = true; error = ""; render();
    const lines = Object.entries(cart).filter(([, q]) => q).map(([k, q]) => {
      const [id, variant] = splitKey(k);
      const i = byId(id);
      const values = variant ? variant.split("/") : [];
      return { id, quantity: q, ...(variant ? { options: Object.fromEntries(axes(i).map((a, n) => [a, values[n]])) } : {}) };
    });
    try {
      // The customer pressed Send order on this summary: that is their confirmation.
      const r = await orderTool("request_order", { items: lines, ...form }, true);
      order = { ...r, status: r.status || "pending", owner_note: "" };
      step = "pick";
      polls = 0; schedulePoll();
    } catch (err) { error = err.message; }
    busy = false; render();
  }

  let polls = 0, timer = null;
  function schedulePoll() {
    clearTimeout(timer);
    if (order && order.status === "pending" && polls < 40) timer = setTimeout(() => { polls++; checkStatus(false); }, 15000);
  }
  async function checkStatus(byHand) {
    if (!order) return;
    if (byHand) { busy = true; error = ""; render(); }
    try {
      const s = await orderTool("get_order_status", { order_id: order.order_id, status_token: order.status_token }, false);
      order = { ...order, status: s.status, owner_note: s.owner_note || "" };
    } catch (err) { if (byHand) error = err.message; }
    busy = false; render(); schedulePoll();
  }

  // ---- start: the MCP Apps handshake ----
  request("ui/initialize", { appInfo: { name: "oasis-items", version: "3.0.0" }, appCapabilities: {}, protocolVersion: PROTOCOL })
    .then((r) => { connected = true; applyContext(r && r.hostContext); notify("ui/notifications/initialized", {}); })
    .catch(() => undefined);

  // Older ChatGPT bridge: the result is on window.openai.toolOutput.
  const fromOpenAI = () => { if (!connected && window.openai && window.openai.toolOutput && !data) { applyContext({ theme: window.openai.theme, locale: window.openai.locale, displayMode: window.openai.displayMode }); show(window.openai.toolOutput); } };
  window.addEventListener("openai:set_globals", fromOpenAI);
  setTimeout(fromOpenAI, 300);
})();
</script>
</body>
</html>
